# The kolom-juddho Worker (worker/src/index.js): serves the game from this folder and the live player count
# at /live. Deploy from the repository root with:  npx wrangler deploy
# Files the site doesn't need are left out by .assetsignore.
name = "kolom-juddho"
main = "worker/src/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "."
binding = "ASSETS"
# Only these run the Worker (the live count, and the pages whose __SITE_URL__ it fills in); every other file
# is served straight from the assets, which doesn't count against the Worker's request quota.
run_worker_first = ["/live", "/room/*", "/feedback", "/stats", "/", "/index.html", "/sw.js", "/robots.txt", "/sitemap.xml"]

# Gives the Worker this deploy's id and date: sw.js uses the id as its cache version.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# One per online match, named by its room code.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects run on the Workers free plan. The lobby keeps only the match counts per day
# (GET /stats); rooms store nothing.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

# The অনুভূতি form's messages (POST /feedback): a D1 database, made once with
#   npx wrangler d1 create kolom-feedback
# Read them in the Cloudflare dashboard (Storage & Databases > D1) or with
#   npx wrangler d1 execute kolom-feedback --remote --command "SELECT * FROM feedback ORDER BY id DESC LIMIT 50"
# Without this binding the form answers "can't send right now" and nothing is stored.
[[d1_databases]]
binding = "FEEDBACK"
database_name = "kolom-feedback"
database_id = "9f5e8dd6-2179-43ae-938f-e5a1c07379bc"

# At most 5 feedback messages a minute from one address. Cloudflare counts them; the game stores no addresses.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# The game's main address: used for canonical links, link previews, the sitemap and challenge links.
SITE_URL = "https://kolom.themicly.com"
# Pages allowed to open the live count, comma separated (localhost:8787 is for wrangler dev only).
ALLOWED_ORIGINS = "https://kolom.themicly.com,https://kolom-juddho.rakib1708.workers.dev,https://rakibdevs.github.io,http://localhost:8787"
